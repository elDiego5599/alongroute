<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alongroute demo</title>
<style>
  :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; color: #17212b; background: #f4f7f8; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 1000px; padding: 20px; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 6px 0 16px; color: #4c5b68; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 14px 0; }
  button, select { font: inherit; padding: 7px 12px; border: 1px solid #aab6bf; border-radius: 7px; background: white; color: inherit; }
  label { display: inline-flex; align-items: center; gap: 8px; }
  input { width: 120px; }
  canvas { display: block; width: 100%; height: min(36vw, 360px); background: white; border: 1px solid #d5dfe4; border-radius: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 2px; }
  .key { display: inline-flex; align-items: center; gap: 7px; }
  i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #metrics { padding: 12px; background: white; border-radius: 8px; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { canvas { height: min(270vw, 1000px); } }
  @media (max-width: 420px) { body { padding: 12px; } .controls { gap: 8px; } }
</style>
</head>
<body>
<h1>Alongroute: three ways to draw a bus</h1>
<p>A seeded GPS simulation on a U-shaped street that retraces one leg. The route is the same in each panel.</p>
<div class="controls">
  <button id="play" type="button">Pause</button>
  <label>Speed <select id="speed"><option value="1">1×</option><option value="4">4×</option></select></label>
  <label>GPS noise <input id="noise" type="range" min="0" max="30" value="15"><span id="noiseValue">15 m</span></label>
  <button id="reset" type="button">Reset (seed 42)</button>
</div>
<canvas id="map" aria-label="Three animated route comparisons"></canvas>
<div class="legend">
  <span class="key"><i style="background:#e45756"></i>Raw GPS fix</span>
  <span class="key"><i style="background:#f2a541"></i>Straight-line interpolation</span>
  <span class="key"><i style="background:#23856d"></i>alongroute Tracker.at()</span>
</div>
<div id="metrics" aria-live="polite">Along-route distance to stop: — · Straight-line distance: —</div>
<script type="module">
import { prepareRoute, Tracker } from './alongroute.js';

const R = 6378137, seed = 42, path = [{x:0,y:0},{x:0,y:220},{x:220,y:220},{x:220,y:0},{x:220,y:220}];
const point = p => ({ lat: p.y / R * 180 / Math.PI, lon: p.x / R * 180 / Math.PI });
const routePoints = path.map(point), route = prepareRoute(routePoints, {loop:false}), stop = point({x:220,y:220});
const lengths = path.slice(1).map((p,i) => Math.hypot(p.x-path[i].x,p.y-path[i].y));
const total = lengths.reduce((a,b)=>a+b,0), speedMps = 10, duration = total/speedMps;
const atMeters = d => { let left=Math.max(0,Math.min(total,d)); for(let i=0;i<lengths.length;i++){ if(left<=lengths[i]){const a=path[i],b=path[i+1],t=left/lengths[i];return point({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});} left-=lengths[i]; } return point(path.at(-1)); };
const headingAt = d => { let left=Math.min(total-0.001,d); for(let i=0;i<lengths.length;i++){if(left<=lengths[i]) return (Math.atan2(path[i+1].x-path[i].x,path[i+1].y-path[i].y)*180/Math.PI+360)%360;left-=lengths[i];}return 0; };
const rngFor = s => { let n=s>>>0; return ()=>{n=(n+0x6D2B79F5)>>>0;let t=n;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}; };
const canvas=document.querySelector('#map'), ctx=canvas.getContext('2d'), play=document.querySelector('#play');
let fixes=[], tracker, nextFix=0, elapsed=0, running=!matchMedia('(prefers-reduced-motion: reduce)').matches, lastFrame=0, raf;
function reset(){ const rand=rngFor(seed), noise=Number(document.querySelector('#noise').value); fixes=[];tracker=new Tracker(route,{vMax:15});nextFix=0;elapsed=0;for(let t=0;t<=duration;t+=5){const d=t*speedMps, base=atMeters(d), angle=rand()*Math.PI*2, radius=noise*Math.sqrt(rand());let x=base.lon*R*Math.PI/180+Math.cos(angle)*radius,y=base.lat*R*Math.PI/180+Math.sin(angle)*radius;if(rand()<0.09){x+=(rand()-.5)*80;y+=(rand()-.5)*80;}fixes.push({t:t*1000,lat:y/R*180/Math.PI,lon:x/R*180/Math.PI,heading:headingAt(d),speed:speedMps,accuracy:noise});}play.textContent=running?'Pause':'Play';draw();}
function local(p){return {x:p.lon*R*Math.PI/180,y:p.lat*R*Math.PI/180};}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(now=0){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);const stacked=matchMedia('(max-width: 600px)').matches, columns=stacked?1:3, rows=stacked?3:1, panelW=w/columns, panelH=h/rows, pad=50, titleH=34;const bounds=path.reduce((b,p)=>({minX:Math.min(b.minX,p.x),maxX:Math.max(b.maxX,p.x),minY:Math.min(b.minY,p.y),maxY:Math.max(b.maxY,p.y)}),{minX:Infinity,maxX:-Infinity,minY:Infinity,maxY:-Infinity});const routeW=bounds.maxX-bounds.minX,routeH=bounds.maxY-bounds.minY,scale=Math.min((panelW-pad*2)/routeW,(panelH-titleH-pad*2)/routeH);const xy=(p,col,row)=>{const q=local(p),drawW=routeW*scale,drawH=routeH*scale,left=col*panelW+(panelW-drawW)/2,top=row*panelH+titleH+(panelH-titleH-drawH)/2;return {x:left+(q.x-bounds.minX)*scale,y:top+(bounds.maxY-q.y)*scale};};
  const idx=Math.min(fixes.length-1,Math.floor(elapsed/5000)), prev=fixes[idx], next=fixes[Math.min(idx+1,fixes.length-1)];
  while(nextFix<=idx)tracker.report(fixes[nextFix++]);
  const t0=prev.t,t1=next.t, f=t1===t0?0:Math.max(0,Math.min(1,(elapsed-t0)/(t1-t0))), a=local(prev),b=local(next), naive={lat:(a.y+(b.y-a.y)*f)/R*180/Math.PI,lon:(a.x+(b.x-a.x)*f)/R*180/Math.PI};
  const along=tracker.at(elapsed), raw=prev;
  const positions=[raw,naive,along?.point??atMeters(elapsed/1000*speedMps)], colors=['#e45756','#f2a541','#23856d'], labels=['Raw fixes','Straight-line','Alongroute'];
  for(let panelIndex=0;panelIndex<3;panelIndex++){const col=stacked?0:panelIndex,row=stacked?panelIndex:0,ox=col*panelW,oy=row*panelH;ctx.save();ctx.translate(ox,oy);ctx.fillStyle='#17212b';ctx.font='600 13px system-ui';ctx.textAlign='center';ctx.fillText(labels[panelIndex],panelW/2,22);ctx.strokeStyle='#dbe4e8';ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>{const q=xy(point(p),col,row);i?ctx.lineTo(q.x-ox,q.y-oy):ctx.moveTo(q.x-ox,q.y-oy);});ctx.stroke();const stopxy=xy(stop,col,row);ctx.fillStyle='#384e5b';ctx.fillRect(stopxy.x-ox-4,stopxy.y-oy-4,8,8);const p=xy(positions[panelIndex],col,row);ctx.fillStyle=colors[panelIndex];ctx.beginPath();ctx.arc(p.x-ox,p.y-oy,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
  const alongD=tracker.distanceTo(stop), straight=along?Math.hypot(local(along.point).x-local(stop).x,local(along.point).y-local(stop).y):null;document.querySelector('#metrics').textContent=`Along-route distance to stop: ${alongD==null?'—':Math.round(alongD)+' m'} · Straight-line distance: ${straight==null?'—':Math.round(straight)+' m'}`;
}
function frame(ts){if(lastFrame)elapsed+=Math.min(100,ts-lastFrame)*Number(document.querySelector('#speed').value);lastFrame=ts;elapsed=Math.min(elapsed,duration*1000);draw(ts);if(elapsed>=duration*1000){running=false;play.textContent='Play';lastFrame=0;}if(running)raf=requestAnimationFrame(frame);}
play.addEventListener('click',()=>{running=!running;play.textContent=running?'Pause':'Play';lastFrame=0;if(running)raf=requestAnimationFrame(frame);else cancelAnimationFrame(raf);});
document.querySelector('#speed').addEventListener('change',()=>{});
document.querySelector('#noise').addEventListener('input',e=>{document.querySelector('#noiseValue').textContent=e.target.value+' m';reset();});
document.querySelector('#reset').addEventListener('click',reset);
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches&&running){running=false;play.textContent='Play';cancelAnimationFrame(raf);}});
window.addEventListener('resize',resize);reset();resize();if(running)raf=requestAnimationFrame(frame);
</script>
</body>
</html>
